<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brevo Login</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="logo-wrapper">
    <h1 class="logo" aria-label="Brevo Logo">Brevo</h1>
  </header>

  <main class="login-container" role="main">
    <form class="login-form" aria-label="Login form" autocomplete="on" novalidate>
      <h2>Log In</h2>

      <label for="email">Email address <span class="required" aria-hidden="true">*</span></label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required aria-required="true" autocomplete="email" />

      <label for="password">Password <span class="required" aria-hidden="true">*</span></label>
      <div class="password-field">
        <input type="password" id="password" name="password" placeholder="Enter your password" required aria-required="true" autocomplete="current-password" />
        <button type="button" id="togglePassword" aria-label="Toggle password visibility">👁️</button>
      </div>

      <button type="submit" class="login-button" aria-label="Submit login form">Log In</button>

      <div class="divider" role="separator"><span>OR</span></div>

      <button type="button" class="login-option google-login" aria-label="Sign in with Google">Sign in with Google</button>
      <button type="button" class="login-option apple-login" aria-label="Sign in with Apple">Sign in with Apple</button>
    </form>

    <nav class="footer-links" aria-label="Login footer">
      <a href="#">Create an account</a>
      <a href="#">I forgot my password</a>
    </nav>
  </main>

  <script src="script.js"></script>
</body>
</html>
